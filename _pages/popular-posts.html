---
layout: page
title: Popular Posts
permalink: /popular-posts/
compress_html: false
---

<style>
  #popular-posts {
    --surface: var(--card-bg, #ffffff);
    --border: var(--border-color, #e0d9ce);
    --text: var(--text-color, #1e1b16);
    --muted: var(--label-color, #7a7265);
    --accent: var(--link-color, #b5451b);
  }

  #popular-posts .pp-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    align-items: center;
  }

  #popular-posts .pp-filter-btn {
    padding: 0.3rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  #popular-posts .pp-filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #popular-posts .pp-filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  #popular-posts .pp-status {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  #popular-posts .pp-progress-bar {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 1rem;
    overflow: hidden;
  }

  #popular-posts .pp-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }

  #popular-posts .pp-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  #popular-posts .pp-item {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
  }

  #popular-posts .pp-item:last-child {
    border-bottom: none;
  }

  #popular-posts .pp-rank {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    min-width: 1.5rem;
    text-align: right;
    flex-shrink: 0;
  }

  #popular-posts .pp-info {
    flex: 1;
    min-width: 0;
  }

  #popular-posts .pp-title a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }

  #popular-posts .pp-title a:hover {
    color: var(--accent);
  }

  #popular-posts .pp-meta {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.2rem;
  }

  #popular-posts .pp-meta .pp-cat {
    margin-right: 0.75rem;
  }

  #popular-posts .pp-views {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }

  #popular-posts .pp-empty {
    color: var(--muted);
    font-style: italic;
    padding: 2rem 0;
    text-align: center;
  }
</style>

<div id="popular-posts">
  <div class="pp-controls" id="pp-controls"></div>

  <div class="pp-progress-bar" id="pp-progress-bar" style="display:none;">
    <div class="pp-progress-fill" id="pp-progress-fill"></div>
  </div>
  <div class="pp-status" id="pp-status">Loading view counts…</div>

  <ol class="pp-list" id="pp-list"></ol>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const GOATCOUNTER_ID = '{{ site.analytics.goatcounter.id }}';
    const BATCH_SIZE = 4;       // GoatCounter rate limit: 4 req/sec
    const BATCH_DELAY = 1100;   // ms between batches

    // Jekyll injects all posts at build time
    const posts = [
      {% for post in site.posts %}
      {
        title: {{ post.title | jsonify }},
        url: {{ post.url | jsonify }},
        date: {{ post.date | date: "%Y-%m-%d" | jsonify }},
        categories: {{ post.categories | jsonify }},
        views: 0
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

    const listEl = document.getElementById('pp-list');
    const statusEl = document.getElementById('pp-status');
    const progressBar = document.getElementById('pp-progress-bar');
    const progressFill = document.getElementById('pp-progress-fill');
    const controlsEl = document.getElementById('pp-controls');

    let activeCategory = null;

    // Collect unique categories
    const categories = [...new Set(posts.flatMap(p => p.categories))].sort();

    // Build filter buttons
    const allBtn = makeFilterBtn('All', null);
    controlsEl.appendChild(allBtn);
    categories.forEach(cat => {
      controlsEl.appendChild(makeFilterBtn(cat, cat));
    });

    function makeFilterBtn(label, category) {
      const btn = document.createElement('button');
      btn.className = 'pp-filter-btn' + (category === null ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        activeCategory = category;
        controlsEl.querySelectorAll('.pp-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      return btn;
    }

    function render() {
      let filtered = activeCategory
        ? posts.filter(p => p.categories.includes(activeCategory))
        : posts;

      filtered.sort((a, b) => b.views - a.views);

      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML = '<li class="pp-empty">No posts in this category.</li>';
        return;
      }

      filtered.forEach((post, i) => {
        const li = document.createElement('li');
        li.className = 'pp-item';
        li.innerHTML = `
          <span class="pp-rank">${i + 1}</span>
          <span class="pp-info">
            <div class="pp-title"><a href="${post.url}">${post.title}</a></div>
            <div class="pp-meta">
              <span class="pp-cat"><i class="far fa-folder-open"></i> ${post.categories.join(', ')}</span>
              <span class="pp-date"><i class="far fa-calendar"></i> ${post.date}</span>
            </div>
          </span>
          <span class="pp-views">${post.views > 0 ? new Intl.NumberFormat().format(post.views) + ' views' : '…'}</span>
        `;
        listEl.appendChild(li);
      });
    }

    // Fetch views in batches to respect rate limits
    async function fetchAllViews() {
      progressBar.style.display = '';
      let completed = 0;

      for (let i = 0; i < posts.length; i += BATCH_SIZE) {
        const batch = posts.slice(i, i + BATCH_SIZE);

        await Promise.all(batch.map(async (post) => {
          try {
            const uri = post.url.replace(/\/$/, '');
            const resp = await fetch(
              `https://${GOATCOUNTER_ID}.goatcounter.com/counter/${encodeURIComponent(uri)}.json`
            );
            const data = await resp.json();
            post.views = parseInt(data.count.replace(/\D/g, ''), 10) || 0;
          } catch {
            post.views = 0;
          }
          completed++;
          progressFill.style.width = `${(completed / posts.length) * 100}%`;
        }));

        render();

        if (i + BATCH_SIZE < posts.length) {
          await new Promise(r => setTimeout(r, BATCH_DELAY));
        }
      }

      progressBar.style.display = 'none';
      const total = posts.reduce((s, p) => s + p.views, 0);
      statusEl.textContent = `${posts.length} posts · ${new Intl.NumberFormat().format(total)} total views`;
    }

    render();
    fetchAllViews();
  });
</script>
