# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en

# Change to your timezone › https://kevinnovak.github.io/Time-Zone-Picker
timezone: Asia/Singapore

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Kuibin Lin # the main title

tagline: Lin's random notes # it will display as the subtitle

# Sidebar subtitle animation (replaces the static tagline visually)
# Supported types: typewriter (typing effect) | decode (scramble/decrypt effect)
# To disable: comment out the entire subtitle_effect block
subtitle_effect:
  type: decode # choose: typewriter | decode
  strings: # phrases to cycle through
    - "Tinkerer"
    - "AI Engineer"
    - "Educator"
  # Shared options
  backDelay: 2000 # ms — pause before switching to next phrase
  startDelay: 500 # ms — delay before animation starts
  # Typewriter-only options
  typeSpeed: 80 # ms — speed per character typed
  backSpeed: 40 # ms — speed per character deleted
  # Decode-only options
  decodeSpeed: 50 # ms — speed per scramble frame

description: >- # used by seo meta and the atom feed
  A personal blog by Kuibin Lin covering homelab, Raspberry Pi, Docker, AI/ML, and self-hosted tools.

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://linsnotes.com"

github:
  username: kuibinlin # change to your GitHub username

# twitter:
#  username: twitter_username # change to your Twitter username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Kuibin Lin
  email: hello@linsnotes.com # change to your email address
  fediverse_handle: # fill in your fediverse handle. E.g. "@username@domain.com"

  links:
    # The first element serves as the copyright owner's link
    # - https://twitter.com/username # change to your Twitter homepage
    - https://github.com/kuibinlin # change to your GitHub homepage
    # Uncomment below to add more social links
    - https://www.linkedin.com/in/kuibinlin
    # - https://www.facebook.com/username

# Site Verification Settings. You can leave these empty if you are using DNS-based verification methods.
# Using DNS-based verification for google, bing.
webmaster_verifications:
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# ------------ LLMs.txt settings › https://llmstxt.org/ ------------------
# ↓ --------------------------

llms_txt:
  # Required
  enabled: true # false or omitted = plugin does nothing

  # Optional — omit or leave empty to use defaults.
  # llms_txt `enabled` must be 'true' for these to apply.
  full: true # generate llms-full.txt (default: false)
  title: "linsnotes.com" # default: site.title → "Site"
  description: "Kuibin Lin's personal blog, on raspberry pi, networking, homelab and AI"

  # Optional — extra links shown under "## Optional" section.
  # Per the llmstxt.org spec, LLMs may skip this section when context is limited.
  # Omit or leave empty to skip this section.

  # optional:
  #   - name: RSS Feed
  #     url: https://yourblog.com/feed.xml
  #     description: Subscribe to new posts
  #   - name: Resume
  #     url: https://yourblog.com/resume.pdf
  #     description: Professional background and experience

# ↑ --------------------------
# The end of LLMs.txt settings

# Web Analytics Settings
analytics:
  google:
    id: G-WCMPKF0K8Q # fill in your Google Analytics ID
  goatcounter:
    id: linsnotes # fill in your GoatCounter ID
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id: # fill in your Fathom Site ID

# Page views settings
pageviews:
  provider: goatcounter # now only supports 'goatcounter'

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light — Use the light color scheme
#     dark — Use the dark color scheme
#
theme_mode: # [light | dark]

# The CDN endpoint for media resources.
# Notice that once it is assigned, the CDN url
# will be added to all media resources (site avatar, posts' images, audio and video files) paths starting with '/'
#
# e.g. 'https://cdn.com'
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: "/assets/img/avatar.png"

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
# It can be overridden by a customized `page.image` in front matter.
social_preview_image: "/assets/img/social-preview.png" # string, local or CORS resources

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  # Display "Edit this post" action on each post page to encourage contributions.
  edit_post:
    enabled: true # set to true to display the "Edit this post" action.
    url: "https://github.com/kuibinlin/kuibinlin.github.io/edit/main"
    # repository base URL, e.g. https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # Use dynamic or static URL for the edit link.
    # If `static_url` is false, the post's path will be appended to the `url` above as the final edit link.
    # Set to true if the URL should remain unchanged, which means each post will share the same edit link.
    static_url: false # [ true | false ]

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  provider: giscus # [disqus | utterances | giscus]
  # The provider options are as follows:
  disqus:
    shortname: # fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances settings › https://utteranc.es/
  utterances:
    repo: # <gh-username>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Giscus options › https://giscus.app
  giscus:
    repo: kuibinlin/blog-comments # <gh-username>/<repo>
    repo_id: R_kgDOTVIpeQ
    category: Linsnotes Comments
    category_id: DIC_kwDOTVIpec4DA9Pd
    mapping: pathname # optional, default to 'pathname'
    strict: 0 # optional, default to '0'
    input_position: bottom # optional, default to 'bottom'
    lang: # optional, default to the value of `site.lang`
    reactions_enabled: 1 # optional, default to the value of `1`

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: true # boolean, keep empty means false
    # specify the Jekyll environment, empty means both
    # only works if `assets.self_host.enabled` is 'true'
    env: # [development | production]

pwa:
  enabled: false # The option for PWA feature (installable)
  cache:
    enabled: false # The option for PWA offline cache
    # Paths defined here will be excluded from the PWA cache.
    # Usually its value is the `baseurl` of another website that
    # shares the same domain name as the current website.
    deny_paths:
      # - "/example"  # URLs match `<SITE_URL>/example/*` will not be cached by the PWA

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  pages:
    output: true

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - rollup.config.js
  - "package*.json"
  - worker/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/