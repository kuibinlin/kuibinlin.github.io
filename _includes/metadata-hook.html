<script src="/assets/js/progress.js" defer></script>
<script src="/assets/js/auto-update.js" defer></script>

{% if site.subtitle_effect %}
  <script>window.subtitleEffectConfig = {{ site.subtitle_effect | jsonify }};</script>
  <script src="/assets/js/subtitle-effect.js" defer></script>
{% endif %}

{% if page.chart or page.charts %}
  <script>
    window.chartConfig = {% if page.charts %}{{ page.charts | jsonify }}{% else %}[{{ page.chart | jsonify }}]{% endif %};
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="/assets/js/chart-renderer.js" defer></script>
{% endif %}

{% if page.map %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/js/map-renderer.js" defer></script>
{% endif %}

<script>
  /* Synchronous head pre-paint: if we arrived at /#posts on a mobile
     viewport (e.g. tapped POSTS from another tab), mark <html> with
     posts-mode BEFORE body parses. The CSS menu-view selector
     (`html:not(.posts-mode) body:has(#post-list)`) then short-circuits
     and Chirpy's default posts layout renders directly — no flash of
     the full-screen menu view that would otherwise appear and then
     get replaced when DOMContentLoaded fires. */
  if (location.hash === '#posts' && window.innerWidth <= 849) {
    document.documentElement.classList.add('posts-mode');
  }
</script>

<script>
  (function () {
    document.addEventListener('DOMContentLoaded', function () {
      /* Inject a "POSTS" sidebar tab right after "HOME" on every page.
         CSS hides it on desktop, so it only shows in the mobile sidebar.
         POSTS is idempotent ("show me the posts"); HOME is the way back.
         - On home: tapping sets html.posts-mode (Chirpy's default posts
           layout returns); also closes the hamburger overlay if open.
         - On other tabs: tapping navigates to /#posts; the head script
           above makes the home page land directly in posts view. */
      var navList = document.querySelector('#sidebar nav ul.nav');
      var homeItem = navList && navList.querySelector('.nav-item');
      if (!homeItem) return;

      /* #post-list is rendered by Chirpy's home layout only — same signal
         our CSS uses (:has(#post-list)) to scope the menu-view override. */
      var isHome = !!document.getElementById('post-list');
      var homeUrl = '{{ "/" | relative_url }}';
      var html = document.documentElement;

      var li = document.createElement('li');
      li.className = 'nav-item posts-toggle';
      var a = document.createElement('a');
      a.className = 'nav-link';
      a.href = isHome ? '#' : homeUrl + '#posts';
      a.setAttribute('role', 'button');
      a.innerHTML = '<i class="fa-fw fas fa-newspaper"></i><span>POSTS</span>';
      li.appendChild(a);
      homeItem.insertAdjacentElement('afterend', li);

      if (!isHome) return; // non-home: link does the work, nothing else to wire.

      /* Strip the hash if the head script consumed it (clean URL on
         subsequent refreshes — refresh returns to default menu view). */
      if (window.location.hash === '#posts') {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }

      a.addEventListener('click', function (e) {
        e.preventDefault();

        /* If the user opened the sidebar via the hamburger, close it
           through Chirpy's own trigger so its internal state stays in
           sync. Otherwise the next hamburger tap would re-open from
           a stale state. */
        var trigger = document.getElementById('sidebar-trigger');
        if (trigger && document.body.hasAttribute('sidebar-display')) {
          trigger.click();
        }

        /* POSTS is idempotent: always end up in posts view. To return
           to menu view, the user taps HOME (Chirpy's existing /-link).
           Skip the work if we're already in posts-mode. */
        if (html.classList.contains('posts-mode')) return;

        /* Suppress Chirpy's 0.4s sidebar slide-transition for the
           menu→posts switch — otherwise the sidebar visibly animates
           off-screen, revealing the posts list mid-slide as a "half-
           shown" state. */
        document.body.classList.add('no-sidebar-transition');
        html.classList.add('posts-mode');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.body.classList.remove('no-sidebar-transition');
          });
        });
      });

      /* Defensive: prevent a stuck posts-mode state if the user
         resizes/rotates into desktop width while toggled on. */
      window.addEventListener('resize', function () {
        if (window.innerWidth > 849 && html.classList.contains('posts-mode')) {
          html.classList.remove('posts-mode');
        }
      });
    });
  })();
</script>
